name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-actions:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"

  analyze-swift:
    name: Analyze (swift)
    # The traced build takes about 30 minutes, so Swift is analyzed on main and weekly, not on PRs.
    if: github.event_name != 'pull_request'
    # Swift needs the same Xcode as CI: default setup's runner can't build the project.
    runs-on: xcode-27
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # CodeQL's build tracer breaks sandboxed tools ("Bad CPU type in executable"): packages are
      # resolved before tracing starts, and macro plugins run without the compiler sandbox.
      - name: Resolve Swift packages
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES
          xcodebuild -resolvePackageDependencies \
            -project Ondelia.xcodeproj \
            -scheme Ondelia \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build application
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ondelia.xcodeproj \
            -scheme Ondelia \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            OTHER_SWIFT_FLAGS='$(inherited) -disable-sandbox'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:swift"
