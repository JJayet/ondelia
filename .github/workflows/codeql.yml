name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Swift needs the same Xcode as CI: default setup's runner can't build the project.
    runs-on: ${{ matrix.language == 'swift' && 'xcode-27' || 'ubuntu-latest' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: swift
            build-mode: manual

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # CodeQL's build tracer breaks sandboxed tools ("Bad CPU type in executable"): packages are
      # resolved before tracing starts, and macro plugins run without the compiler sandbox.
      - name: Resolve Swift packages
        if: matrix.build-mode == 'manual'
        run: |
          defaults write com.apple.dt.Xcode IDEPackageSupportDisableManifestSandbox -bool YES
          xcodebuild -resolvePackageDependencies \
            -project Ondelia.xcodeproj \
            -scheme Ondelia \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build application
        if: matrix.build-mode == 'manual'
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ondelia.xcodeproj \
            -scheme Ondelia \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -disableAutomaticPackageResolution \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            OTHER_SWIFT_FLAGS='$(inherited) -disable-sandbox'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
