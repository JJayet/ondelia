name: Ondelia CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache build dependencies
        uses: actions/cache@v4
        with:
          path: |
            DerivedData/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Ondelia.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Build application and test targets
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Ondelia.xcodeproj \
            -scheme Ondelia \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee build-output.txt

      - name: Run complete test suite
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Ondelia.xcodeproj \
            -scheme Ondelia \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath DerivedData/SourcePackages \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            | tee test-output.txt

      - name: Publish verified status
        if: success()
        run: |
          echo '## Validation passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'The application, unit tests, and UI tests built and the complete test suite passed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure status
        if: failure()
        run: |
          echo '## Validation failed' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the failing build or test step and the attached diagnostics.' >> "$GITHUB_STEP_SUMMARY"

      - name: Archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ github.run_number }}
          path: |
            TestResults.xcresult
            build-output.txt
            test-output.txt
          if-no-files-found: ignore
          retention-days: 14
